<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>TourMIX - Pacotes</title>

        <!-- Fontes profissionais -->
          <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

                <style>
                    * {
                          margin: 0;
                                padding: 0;
                                      box-sizing: border-box;
                                          }

                                              body {
                                                    font-family: 'Inter', system-ui, -apple-system, sans-serif;
                                                          background: #f8fafc;
                                                                color: #1e293b;
                                                                      padding: 24px 16px;
                                                                            line-height: 1.5;
                                                                                }

                                                                                    .container {
                                                                                          max-width: 480px;
                                                                                                margin: 0 auto;
                                                                                                      display: flex;
                                                                                                            flex-direction: column;
                                                                                                                  gap: 24px;
                                                                                                                      }

                                                                                                                          /* ===== CARD ===== */
                                                                                                                              .card {
                                                                                                                                    background: white;
                                                                                                                                          border-radius: 20px;
                                                                                                                                                overflow: hidden;
                                                                                                                                                      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
                                                                                                                                                          }

                                                                                                                                                              .card-image {
                                                                                                                                                                    position: relative;
                                                                                                                                                                          width: 100%;
                                                                                                                                                                                height: 220px;
                                                                                                                                                                                      overflow: hidden;
                                                                                                                                                                                          }

                                                                                                                                                                                              .card-image img {
                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                          height: 100%;
                                                                                                                                                                                                                object-fit: cover;
                                                                                                                                                                                                                      display: block;
                                                                                                                                                                                                                          }

                                                                                                                                                                                                                              .badge-novo {
                                                                                                                                                                                                                                    position: absolute;
                                                                                                                                                                                                                                          top: 16px;
                                                                                                                                                                                                                                                left: 16px;
                                                                                                                                                                                                                                                      background: #0f766e;
                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                  font-size: 12px;
                                                                                                                                                                                                                                                                        font-weight: 600;
                                                                                                                                                                                                                                                                              padding: 6px 12px;
                                                                                                                                                                                                                                                                                    border-radius: 20px;
                                                                                                                                                                                                                                                                                          letter-spacing: 0.02em;
                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                  .card-content {
                                                                                                                                                                                                                                                                                                        padding: 20px 22px 24px;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                /* Tags (7 noites • All Inclusive) */
                                                                                                                                                                                                                                                                                                                    .tags {
                                                                                                                                                                                                                                                                                                                          font-size: 13px;
                                                                                                                                                                                                                                                                                                                                font-weight: 500;
                                                                                                                                                                                                                                                                                                                                      color: #64748b;
                                                                                                                                                                                                                                                                                                                                            margin-bottom: 8px;
                                                                                                                                                                                                                                                                                                                                                  letter-spacing: 0.01em;
                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                          /* Nome do pacote - fonte elegante */
                                                                                                                                                                                                                                                                                                                                                              .package-name {
                                                                                                                                                                                                                                                                                                                                                                    font-family: 'Cormorant Garamond', serif;
                                                                                                                                                                                                                                                                                                                                                                          font-size: 26px;
                                                                                                                                                                                                                                                                                                                                                                                font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                      color: #0f766e;
                                                                                                                                                                                                                                                                                                                                                                                            margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                  letter-spacing: -0.01em;
                                                                                                                                                                                                                                                                                                                                                                                                        line-height: 1.2;
                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                /* Descrição */
                                                                                                                                                                                                                                                                                                                                                                                                                    .description {
                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 14.5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                color: #475569;
                                                                                                                                                                                                                                                                                                                                                                                                                                      margin-bottom: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                            line-height: 1.55;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* Área do preço + botão */
                                                                                                                                                                                                                                                                                                                                                                                                                                                        .price-row {
                                                                                                                                                                                                                                                                                                                                                                                                                                                              display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                gap: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .price-info {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .price-label {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #94a3b8;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-weight: 500;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    margin-bottom: 2px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            /* PREÇO - exatamente igual nos dois cards */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .price {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-family: 'Inter', system-ui, sans-serif;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 22px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #0f172a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              letter-spacing: -0.02em;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    line-height: 1.2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .price span {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-weight: 500;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: #64748b;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /* Botão */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .btn-details {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #0f766e;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  padding: 12px 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 50px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-family: 'Inter', system-ui, sans-serif;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      white-space: nowrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            transition: background 0.2s ease, transform 0.15s ease;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .btn-details:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          background: #0d9488;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                transform: translateY(-1px);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* Card sem imagem (Maldivas) */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .card-no-image .card-content {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  padding-top: 24px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* Logo pequeno no topo do primeiro card (opcional) */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .logo {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-family: 'Inter', sans-serif;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #0f766e;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-bottom: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              gap: 4px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .logo span {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: #14b8a6;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- ===== CARD 1 - Maldivas Paradise ===== -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <article class="card card-no-image">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="logo">T<span>+</span>our<span>MIX</span></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="tags">7 noites • All Inclusive</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h2 class="package-name">Maldivas Paradise</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p class="description">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Bangalôs sobre o mar, snorkel e jantares ao pôr do sol.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="price-row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="price-info">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <span class="price-label">A partir de</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="price">R$ 18.900 <span>/pessoa</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button class="btn-details">Ver detalhes</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
